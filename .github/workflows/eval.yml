name: offline-eval

on:
  push:
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development package
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest
      - name: Run zero-key demo and evaluation
        run: |
          python -m prooftrail demo
          python -m prooftrail eval-demo
      - name: Check for committed secrets
        run: python scripts/check_no_secrets.py
